# Publishes the node to npm with a provenance statement when a GitHub release (v1.0.0, v1.0.1 …) is published.
# n8n requires this for verified community nodes. npm trusts this workflow through a Trusted Publisher
# connection (npm package settings → Trusted Publisher → GitHub Actions, workflow publish.yml), so no token is needed.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: npm install
      - run: npm run lint
      - run: npm run build
      # --ignore-scripts: lint and build already ran above; this skips the prepublishOnly guard, which only allows
      # publishing through `n8n-node release` on a developer's computer.
      - run: npm publish --provenance --access public --ignore-scripts
